# Configuración de despliegue para Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Redirección SPA: todas las rutas se sirven desde index.html
# para que react-router funcione al recargar o entrar por URL directa
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
